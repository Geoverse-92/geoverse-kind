<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVerse Phygital Pixel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="stat-badge">LVL: <span id="statLvl">12</span></div>
            <div class="stat-badge">PLN: <span id="statGold">5400</span></div>
            <div class="stat-badge">BON: <span id="statVouchers">15</span></div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- MAP SCREEN - IZOMETRYCZNY PIXEL ART -->
            <div id="screen-map" class="screen active">
                <div class="isometric-canvas-container">
                    <div class="pixel-city-bg">
                        <div class="pixel-speech-bubble" style="top: 25%; left: 18%;">SPRZDAM ROWER</div>
                        <div class="pixel-speech-bubble" style="top: 45%; right: 20%; background: #112222; color: #00ffcc; border-color: #00ffcc;">ZLECENIA: ZARA</div>
                        <div class="hex-grid-overlay"></div>
                        <div style="font-size: 3rem; z-index: 4; text-shadow: 2px 2px #000;">🏰🚲</div>
                        <div style="font-size: 0.65rem; color: var(--accent-neon); margin-top: 10px; font-weight: bold; background: rgba(0,0,0,0.8); padding: 4px 8px; border: 1px solid var(--accent-neon);">GEOVERSE: SEKTOR 9</div>
                    </div>
                </div>
                <div class="map-actions-overlay">
                    <button id="btnCheckIn" class="btn-action">🌐 Zamelduj się w Heksagonie</button>
                </div>
            </div>

            <!-- PROFILE SCREEN / AVATAR GENERATOR -->
            <div id="screen-profile" class="screen">
                <h2 style="font-size: 0.75rem; margin-bottom: 6px; color: var(--accent-neon);">[KREATOR POSTACI]</h2>
                <div class="card" style="text-align: center;">
                    <div id="avatarDisplay" class="pixel-avatar-box">🧢🧥</div>
                    <div id="profileNameDisplay" style="font-weight: bold; font-size: 0.75rem;">Agent_Rook</div>
                    <div id="profileClassDisplay" style="color: var(--accent-neon); font-size: 0.6rem;">[Cyber Courier]</div>
                    <div id="currentEquipmentLabel" style="font-size: 0.5rem; margin-top: 4px; color: #8b949e;">Sprzęt: 🚲 | Aura: 🟢</div>
                </div>
                <div class="card">
                    <h3 style="font-size: 0.65rem; margin-bottom: 4px;">Warsztat Wyglądu</h3>
                    <div class="customizer-grid">
                        <div>
                            <label style="font-size: 0.45rem;">Nick:</label>
                            <input type="text" id="inputName" value="Agent_Rook" />
                        </div>
                        <div>
                            <label style="font-size: 0.45rem;">Rola:</label>
                            <select id="selectVoc">
                                <option value="Cyber Courier">Cyber Courier</option>
                                <option value="Street Merchant">Street Merchant</option>
                                <option value="Data Warden">Data Warden</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 0.45rem;">Głowa:</label>
                            <select id="selectHead">
                                <option value="🧢">Czapka z daszkiem</option>
                                <option value="🪖">Hełm Taktyczny</option>
                                <option value="🤠">Kapelusz Kowbojski</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 0.45rem;">Strój:</label>
                            <select id="selectOutfit">
                                <option value="🧥">Kurtka skórzana</option>
                                <option value="👕">Koszulka sieciowa</option>
                                <option value="🦺">Kamizelka</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 0.45rem;">Pojazd:</label>
                            <select id="selectWeapon">
                                <option value="🚲">Rower miejski</option>
                                <option value="🛵">Skuter elektryczny</option>
                                <option value="🛹">Deskorolka</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 0.45rem;">Aura:</label>
                            <select id="selectAddon">
                                <option value="🟢">Zielona aura</option>
                                <option value="⚡">Wyładowanie</option>
                                <option value="🔥">Płomień</option>
                            </select>
                        </div>
                    </div>
                    <button id="btnSaveProfile" class="btn-action" style="margin-top: 8px;">Zapisz Postać</button>
                    <button id="btnResetAccount" class="btn-action" style="margin-top: 5px; background: #541212; border-color: #f85149;">Reset</button>
                </div>
            </div>

            <!-- HOUSING / PARTNERS SCREEN -->
            <div id="screen-housing" class="screen">
                <h2 style="font-size: 0.75rem; margin-bottom: 6px;">Strefy Partnerskie</h2>
                <div id="housingGrid" class="housing-grid" style="margin-top: 4px;"></div>
                <div class="card" style="margin-top: 8px;">
                    <h3 style="font-size: 0.65rem;">Skaner Paragonów</h3>
                    <p style="font-size: 0.55rem; margin-bottom: 5px;">Prześlij dowód transakcji u partnerów (Zara, Rossmann), aby przejąć prowizję.</p>
                    <button id="btnOpenScanner" class="btn-action">📷 Zeskanuj Dowód</button>
                </div>
            </div>

            <!-- FEED SCREEN -->
            <div id="screen-feed" class="screen">
                <h2 style="font-size: 0.75rem; margin-bottom: 6px;">Logi Świata</h2>
                <div id="portalFeed" style="margin-top: 4px;"></div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="nav-bar">
            <button data-target="screen-map" class="active">🌐 MAPA</button>
            <button data-target="screen-housing">🏬 SKLEPY</button>
            <button data-target="screen-feed">📡 LOGI</button>
            <button data-target="screen-profile">👤 PROFIL</button>
        </nav>

        <div id="toast-container" style="position: fixed; bottom: 55px; left: 10px; right: 10px; z-index: 9999;"></div>
    </div>

    <script type="module" src="src/core/app.js"></script>
</body>
</html>
