<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVerse Phygital</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="stat-badge">LVL <span id="statLvl">1</span></div>
            <div class="stat-badge">💰 <span id="statGold">1200</span> PLN</div>
            <div class="stat-badge">🎟️ <span id="statVouchers">2</span></div>
        </header>

        <!-- Main Content Screens -->
        <main class="content">
            <!-- MAP SCREEN -->
            <div id="screen-map" class="screen active">
                <div id="map-view" style="width: 100%; height: 100%;"></div>
                <div class="map-actions-overlay">
                    <button id="btnCheckIn" class="btn-action">📍 Zamelduj się (GPS)</button>
                </div>
            </div>

            <!-- PROFILE SCREEN -->
            <div id="screen-profile" class="screen">
                <h2>Profil Agenta</h2>
                <div class="card">
                    <div id="avatarDisplay" style="font-size: 3rem;">👨‍💻</div>
                    <div id="profileNameDisplay" style="font-weight: bold; font-size: 1.2rem;">Agent</div>
                    <div id="profileClassDisplay" style="color: var(--accent-green); font-size: 0.8rem;">Cyber Tech</div>
                    <div id="currentOutfitLabel" style="font-size: 0.7rem; margin-top: 5px;">Aktywny skin: 💻</div>
                </div>
                <div class="card">
                    <h3>Edycja Tożsamości</h3>
                    <input type="text" id="inputName" placeholder="Nazwa agenta" />
                    <select id="inputAvatarType">
                        <option value="👨‍💻|Cyber Tech|💻">Cyber Tech</option>
                        <option value="🥷|Shadow Operative|⚡">Shadow Operative</option>
                        <option value="🧙‍♂️|Data Alchemist|🔮">Data Alchemist</option>
                    </select>
                    <button id="btnSaveProfile" class="btn-action" style="margin-top: 10px;">Zapisz profil</button>
                    <button id="btnResetAccount" class="btn-danger" style="margin-top: 10px; background: #ff4444; color: white; border: none; padding: 8px; border-radius: 6px;">Resetuj Postać</button>
                </div>
            </div>

            <!-- ZONE / HOUSING SCREEN -->
            <div id="screen-housing" class="screen">
                <h2>Strefy i Biznesy</h2>
                <div id="housingGrid" class="housing-grid"></div>
                <div class="card" style="margin-top: 15px;">
                    <h3>Skaner Paragonów</h3>
                    <p style="font-size: 0.75rem;">Zeskanuj dowód zakupu w strefie partnerskiej, aby zdobyć walutę.</p>
                    <button id="btnOpenScanner" class="btn-action">📷 Skanuj Paragon / Dowód</button>
                </div>
            </div>

            <!-- FEED SCREEN -->
            <div id="screen-feed" class="screen">
                <h2>Aktywność Świata</h2>
                <div id="portalFeed"></div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="nav-bar">
            <button data-target="screen-map" class="active">🗺️ Mapa</button>
            <button data-target="screen-housing">🏢 Strefy</button>
            <button data-target="screen-feed">📡 Feed</button>
            <button data-target="screen-profile">👤 Profil</button>
        </nav>

        <div id="toast-container" style="position: fixed; bottom: 70px; left: 20px; right: 20px; z-index: 9999;"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- App Entry -->
    <script type="module" src="src/core/app.js"></script>
</body>
</html>
