<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVerse Phygital Pixel</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="stat-badge">LVL: <span id="statLvl">12</span></div>
            <div class="stat-badge">PLN: <span id="statGold">5400</span></div>
            <div class="stat-badge">BON: <span id="statVouchers">15</span></div>
        </header>

        <!-- Main Content -->
        <main class="content">
            <!-- MAP SCREEN -->
            <div id="screen-map" class="screen active">
                <div id="map-view" style="width: 100%; height: 100%;"></div>
                <div class="map-actions-overlay">
                    <button id="btnCheckIn" class="btn-action">🌐 Zamelduj się w Heksagonie</button>
                </div>
            </div>

            <!-- PROFILE SCREEN / AVATAR GENERATOR -->
            <div id="screen-profile" class="screen">
                <h2 style="font-size: 0.8rem; margin-bottom: 8px; color: var(--accent-neon);">[KREATOR POSTACI & AVATAR]</h2>
                <div class="card" style="text-align: center;">
                    <div id="avatarDisplay" class="pixel-avatar-box">🧢🧥</div>
                    <div id="profileNameDisplay" style="font-weight: bold; font-size: 0.8rem;">Agent_Rook</div>
                    <div id="profileClassDisplay" style="color: var(--accent-neon); font-size: 0.65rem;">[Cyber Courier]</div>
                    <div id="currentEquipmentLabel" style="font-size: 0.55rem; margin-top: 4px; color: #8b949e;">Sprzęt: 🚲 | Aura: 🟢</div>
                </div>
                <div class="card">
                    <h3 style="font-size: 0.7rem; margin-bottom: 6px;">Warsztat Wyglądu i Opcji</h3>
                    <div class="customizer-grid">
                        <div>
                            <label style="font-size: 0.5rem;">Nick Agenta:</label>
                            <input type="text" id="inputName" value="Agent_Rook" />
                        </div>
                        <div>
                            <label style="font-size: 0.5rem;">Rola / Klasa:</label>
                            <select id="selectVoc">
                                <option value="Cyber Courier">Cyber Courier</option>
                                <option value="Street Merchant">Street Merchant</option>
                                <option value="Data Warden">Data Warden</option>
                                <option value="Grid Runner">Grid Runner</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 0.5rem;">Nakrycie głowy:</label>
                            <select id="selectHead">
                                <option value="🧢">Czapka z daszkiem</option>
                                <option value="🪖">Hełm Taktyczny</option>
                                <option value="🤠">Kapelusz Kowbojski</option>
                                <option value="🤖">Cyber Maska</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 0.5rem;">Strój / Kurtka:</label>
                            <select id="selectOutfit">
                                <option value="🧥">Kurtka skórzana</option>
                                <option value="👕">Koszulka sieciowa</option>
                                <option value="🦺">Kamizelka ostrzegawcza</option>
                                <option value="🥋">Pancerz z włókna</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 0.5rem;">Pojazd / Sprzęt:</label>
                            <select id="selectWeapon">
                                <option value="🚲">Rower miejski</option>
                                <option value="🛵">Skuter elektryczny</option>
                                <option value="🛹">Deskorolka antygrawitacyjna</option>
                                <option value="📦">Paczka kurierska</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-size: 0.5rem;">Efekt / Ikona:</label>
                            <select id="selectAddon">
                                <option value="🟢">Zielona aura</option>
                                <option value="⚡">Wyładowanie</option>
                                <option value="🔥">Płomień</option>
                                <option value="⭐">Gwiazda</option>
                            </select>
                        </div>
                    </div>
                    <button id="btnSaveProfile" class="btn-action" style="margin-top: 10px;">Zapisz i Wygeneruj Postać</button>
                    <button id="btnResetAccount" class="btn-action" style="margin-top: 6px; background: #541212; border-color: #f85149;">Reset Postaci (Hard Reset)</button>
                </div>
            </div>

            <!-- HOUSING / PARTNERS SCREEN -->
            <div id="screen-housing" class="screen">
                <h2>Strefy Partnerskie & Biznesy</h2>
                <div id="housingGrid" class="housing-grid" style="margin-top: 8px;"></div>
                <div class="card" style="margin-top: 10px;">
                    <h3>Skaner Paragonów</h3>
                    <p style="font-size: 0.6rem; margin-bottom: 6px;">Prześlij dowód transakcji u partnerów (Zara, Rossmann, Nike), aby przejąć prowizję.</p>
                    <button id="btnOpenScanner" class="btn-action">📷 Zeskanuj Paragon / Dowód</button>
                </div>
            </div>

            <!-- FEED SCREEN -->
            <div id="screen-feed" class="screen">
                <h2>Logi Aktywności Świata</h2>
                <div id="portalFeed" style="margin-top: 6px;"></div>
            </div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="nav-bar">
            <button data-target="screen-map" class="active">🌐 MAPA</button>
            <button data-target="screen-housing">🏬 SKLEPY</button>
            <button data-target="screen-feed">📡 LOGI</button>
            <button data-target="screen-profile">👤 PROFIL</button>
        </nav>

        <div id="toast-container" style="position: fixed; bottom: 60px; left: 12px; right: 12px; z-index: 9999;"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="src/core/app.js"></script>
</body>
</html>
