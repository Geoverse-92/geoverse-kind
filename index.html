<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoVerse Beta</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@300;400;700&display=swap');

        :root {
            --bg-dark: #0f1015;
            --panel-bg: #161821;
            --accent-green: #00ffcc;
            --accent-pink: #ff00ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body { margin: 0; background: var(--bg-dark); color: var(--text-main); font-family: 'Roboto', sans-serif; overflow-x: hidden; }
        header { background: #12131a; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-green); }
        h1 { font-family: 'Press Start 2P', cursive; color: var(--accent-green); font-size: 0.8rem; margin: 0; }

        .screen { display: none; padding: 20px; padding-bottom: 100px; box-sizing: border-box; }
        .screen.active { display: block; }

        .card { background: var(--panel-bg); border: 1px solid #2a2e3d; border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .avatar-box { width: 100px; height: 100px; background: #202330; border: 3px solid var(--accent-pink); border-radius: 50%; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; }
        
        label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; font-family: 'Press Start 2P'; }
        input, select { width: 100%; background: #0f1015; border: 1px solid #33384f; color: #fff; padding: 12px; border-radius: 8px; font-size: 1rem; margin-bottom: 15px; box-sizing: border-box; }

        .btn { background: var(--accent-green); color: #000; width: 100%; padding: 15px; font-family: 'Press Start 2P', cursive; font-size: 0.7rem; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; text-align: center; }
        .btn:hover { background: var(--accent-pink); color: #fff; }
        .btn-secondary { background: #2a2e3d; color: #fff; margin-top: 8px; }

        .inventory-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .item-card { background: #202330; border: 1px solid #3b4259; padding: 12px; border-radius: 8px; text-align: center; cursor: pointer; }
        .item-card.equipped { border-color: var(--accent-green); background: rgba(0,255,204,0.05); }
        .item-card h4 { margin: 5px 0 0 0; font-size: 0.8rem; font-family: 'Press Start 2P'; color: var(--accent-green); }

        #map { height: 55vh; width: 100%; border-radius: 12px; border: 1px solid #2a2e3d; margin-bottom: 15px; }

        .quest-item { background: #202330; border-left: 4px solid var(--accent-pink); padding: 12px; border-radius: 6px; margin-bottom: 10px; }
        .quest-item h4 { margin: 0 0 5px 0; font-size: 0.85rem; color: #fff; }
        .quest-item p { margin: 0; font-size: 0.8rem; color: var(--text-muted); }

        nav { display: flex; background: #12131a; border-top: 2px solid #2a2e3d; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; }
        nav button { flex: 1; background: none; border: none; color: var(--text-muted); padding: 15px 5px; font-family: 'Press Start 2P'; font-size: 0.45rem; cursor: pointer; text-align: center; }
        nav button.active { color: var(--accent-green); background: #1a1c26; border-top: 2px solid var(--accent-green); }
    </style>
</head>
<body>

    <header>
        <h1>GEOVERSE</h1>
        <span style="font-size: 0.6rem; color: var(--accent-green); font-family: 'Press Start 2P';">BETA</span>
    </header>

    <div id="screen-profile" class="screen active">
        <div class="card">
            <h3 style="font-family: 'Press Start 2P'; font-size: 0.8rem; color: var(--accent-pink); margin-top:0;">TWÓJ AWATAR</h3>
            <div class="avatar-box" id="avatarDisplay">👷‍♂️</div>
            
            <label>Pseudonim</label>
            <input type="text" id="inputName" value="Krzysztof Budowlaniec" />

            <label>Wybierz postać</label>
            <select id="inputAvatarType">

                <option value="🏃‍♀️">Aktywny Mieszkaniec</option>
            </select>

            <button class="btn" onclick="goToMap()">ZAPISZ I WEJDŹ NA MAPĘ</button>
        </div>
    </div>

    <div id="screen-wardrobe" class="screen">
        <div class="card">
            <h3 style="font-family: 'Press Start 2P'; font-size: 0.8rem; color: var(--accent-green); margin-top:0;">SZAFA / UBRANIA</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted);">Ciuchy z Manufaktury i Castoramy.</p>
            <div class="inventory-grid" id="inventoryContainer"></div>

        <button class="btn btn-secondary" onclick="scanShopping()">+ ZESKANUJ NOWY ZAKUP</button>
    </div>

    <div id="screen-map" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
            <span id="mapUserLabel" style="font-size:0.75rem; color:var(--accent-green); font-family:'Press Start 2P';">Gracz</span>
            <span style="font-size:0.7rem; color:var(--accent-pink);">GPS LIVE</span>
        </div>
        <div id="map"></div>
    </div>

    <div id="screen-quests" class="screen">
        <div class="card">
            <h3 style="font-family: 'Press Start 2P'; font-size: 0.8rem; color: var(--accent-green); margin-top:0;">ZLECENIA</h3>
            <div id="questList">
                <div class="quest-item">
                    <h4>Remont łazienki - ul. Piotrkowska</h4>
                    <p>Materiały z Castoramy! 💰 2500 PLN</p>
                </div>
            </div>
        </div>
        <button class="btn" onclick="addQuest()">+ DODAJ ZLECENIE</button>
    </div>

    <nav>
        <button id="btn-profile" class="active" onclick="switchTab('screen-profile', this)">POSTAĆ</button>
        <button id="btn-wardrobe" onclick="switchTab('screen-wardrobe', this)">SZAFA</button>
        <button id="btn-map" onclick="switchTab('screen-map', this)">MAPA</button>
        <button id="btn-quests" onclick="switchTab('screen-quests', this)">ZLECENIA</button>
    </nav>
