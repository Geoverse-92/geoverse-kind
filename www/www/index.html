<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#05060a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>GeoVerse - Phygital Portal</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@300;400;700&display=swap');

        :root {
            --bg-dark: #05060a;
            --panel-bg: #0e111a;
            --panel-border: #1f2638;
            --accent-green: #00ffcc;
            --accent-pink: #ff00ff;
            --accent-gold: #ffd700;
            --accent-blue: #0099ff;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --danger: #ff3366;
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { margin: 0; background: var(--bg-dark); color: var(--text-main); font-family: 'Roboto', sans-serif; overflow-x: hidden; overscroll-behavior-y: none; }

        header { background: rgba(8, 10, 16, 0.95); padding: max(12px, env(safe-area-inset-top)) 15px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent-green); box-shadow: 0 0 20px rgba(0,255,204,0.15); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(10px); }
        .brand { display: flex; align-items: center; gap: 8px; }
        h1 { font-family: 'Press Start 2P', cursive; color: var(--accent-green); font-size: 0.65rem; margin: 0; text-shadow: 0 0 8px rgba(0,255,204,0.4); letter-spacing: 1px; }
        .player-hud { font-family: 'Press Start 2P', cursive; font-size: 0.35rem; color: var(--accent-gold); display: flex; gap: 8px; background: #121622; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--panel-border); align-items: center; }

        .screen { display: none; padding: 15px; padding-bottom: calc(100px + env(safe-area-inset-bottom)); animation: fadeIn 0.3s ease-out; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 12px; padding: 16px; margin-bottom: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
        
        h3 { font-family: 'Press Start 2P', cursive; font-size: 0.75rem; margin: 0 0 10px 0; line-height: 1.4; }
        p { font-size: 0.8rem; color: var(--text-muted); margin: 0 0 8px 0; line-height: 1.5; }
        label { display: block; font-size: 0.6rem; color: var(--text-muted); margin-bottom: 6px; font-family: 'Press Start 2P', cursive; }
        input, select { width: 100%; background: #05060a; border: 1px solid #28304a; color: #fff; padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 15px; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--accent-green); box-shadow: 0 0 10px rgba(0,255,204,0.2); }

        .btn { background: var(--accent-green); color: #000; width: 100%; padding: 14px; font-family: 'Press Start 2P', cursive; font-size: 0.6rem; border: none; cursor: pointer; border-radius: 8px; font-weight: bold; text-align: center; transition: 0.2s; }
        .btn:active { transform: scale(0.96); }
        .btn-secondary { background: #1f2638; color: #fff; margin-top: 8px; }
        .btn-blue { background: var(--accent-blue); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-sm { padding: 10px; font-size: 0.5rem; }

        .avatar-container { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .avatar-box { width: 75px; height: 75px; background: #161b29; border: 3px solid var(--accent-pink); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; box-shadow: 0 0 15px rgba(255,0,255,0.3); }
        .avatar-info h3 { margin: 0 0 5px 0; font-size: 0.85rem; color: #fff; }

        .feed-item { background: #121624; border: 1px solid var(--panel-border); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
        .feed-header { display: flex; justify-content: space-between; font-size: 0.6rem; color: var(--accent-pink); font-family: 'Press Start 2P', cursive; margin-bottom: 8px; }
        .feed-body { font-size: 0.8rem; color: var(--text-muted); margin: 0; }

        .inventory-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .item-card { background: #121624; border: 1px solid var(--panel-border); padding: 12px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .item-card.equipped { border-color: var(--accent-green); background: rgba(0,255,204,0.08); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,255,204,0.1); }
        .item-card h4 { margin: 8px 0 4px 0; font-size: 0.6rem; font-family: 'Press Start 2P', cursive; color: var(--text-main); line-height: 1.3; }

        #map-view { height: 50vh; width: 100%; border-radius: 12px; border: 2px solid var(--accent-green); margin-bottom: 12px; box-shadow: 0 0 20px rgba(0,255,204,0.1); z-index: 1; background: #0a0c12; }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #0e111a; color: #fff; border: 1px solid var(--accent-green); font-family: 'Roboto', sans-serif; }
        .leaflet-popup-content { margin: 12px; }
        
        .build-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .build-slot { background: #121624; border: 2px dashed var(--panel-border); border-radius: 10px; height: 85px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.8rem; cursor: pointer; transition: 0.2s; }
        .build-slot.active { border-style: solid; border-color: var(--accent-gold); background: rgba(255,215,0,0.05); }

        .quest-item { background: #121624; border-left: 4px solid var(--accent-gold); padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--panel-border); }

        nav { display: flex; background: rgba(8, 10, 16, 0.95); border-top: 2px solid var(--panel-border); position: fixed; bottom: 0; left: 0; width: 100%; z-index: 9999; backdrop-filter: blur(10px); padding-bottom: env(safe-area-inset-bottom); }
        nav button { flex: 1; background: none; border: none; color: var(--text-muted); padding: 16px 2px; font-family: 'Press Start 2P', cursive; font-size: 0.4rem; cursor: pointer; text-align: center; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        nav button i { font-style: normal; font-size: 1rem; }
        nav button.active { color: var(--accent-green); border-top: 2px solid var(--accent-green); background: linear-gradient(0deg, rgba(0,255,204,0) 0%, rgba(0,255,204,0.05) 100%); }

        #toast-container { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 10000; display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; pointer-events: none; }
        .toast { background: rgba(14, 17, 26, 0.95); border-left: 4px solid var(--accent-green); padding: 12px 15px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 10px; font-size: 0.8rem; opacity: 0; transform: translateY(-20px); transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); border: 1px solid var(--panel-border); }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { border-left-color: var(--danger); }

        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10001; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); opacity: 0; transition: 0.3s; }
        #modal-overlay.show { display: flex; opacity: 1; }
        .modal-box { background: var(--panel-bg); border: 1px solid var(--accent-green); border-radius: 12px; padding: 20px; width: 90%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,255,204,0.2); }
        .modal-title { font-family: 'Press Start 2P', cursive; font-size: 0.65rem; color: var(--accent-green); margin-bottom: 15px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <div class="brand"><h1>GEOVERSE</h1></div>
        <div class="player-hud">
            <span>LVL <span id="statLvl">1</span></span>
            <span>💰 <span id="statGold">0</span></span>
            <span>⚡ <span id="statEnergy">100</span></span>
        </div>
    </header>

    <div id="toast-container"></div>

    <div id="modal-overlay">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Tytuł Modala</div>
            <input type="text" id="modalInput" placeholder="Wpisz wartość..." />
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal()">ANULUJ</button>
                <button class="btn" id="modalConfirmBtn">ZATWIERDŹ</button>
            </div>
        </div>
    </div>

    <div id="screen-portal" class="screen active">
        <div class="card" style="border-color: var(--accent-green);">
            <h3 style="color: var(--accent-green);">CENTRALA ŚWIATA</h3>
            <p>Hybrydowy ekosystem Phygital.</p>
        </div>
        <div id="portalFeed"></div>
        <button class="btn" onclick="openPostModal()">+ DODAJ WPIS DO KRONIKI</button>
    </div>

    <div id="screen-profile" class="screen">
        <div class="card">
            <h3 style="color: var(--accent-green);">KREACJA AWATARA</h3>
            <div class="avatar-container">
                <div class="avatar-box" id="avatarDisplay">🧑‍💻</div>
                <div class="avatar-info">
                    <h3 id="profileNameDisplay" style="font-family: 'Press Start 2P', cursive;">Nowy Gracz</h3>
                    <p id="profileClassDisplay">Wybierz ścieżkę</p>
                </div>
            </div>
            <label>Identyfikator (Nick)</label>
            <input type="text" id="inputName" placeholder="Wpisz nick..." />
            <label>Profesja</label>
            <select id="inputAvatarType" onchange="updateAvatarPreview()">
                <option value="🧑‍💼|Inwestor Korporacyjny|👔">Inwestor Korporacyjny</option>
                <option value="👷‍♂️|Fachowiec / Remonty|🦺">Fachowiec / Remonty</option>
                <option value="🏃‍♀️|Aktywny Mieszkaniec|👟">Aktywny Mieszkaniec</option>
                <option value="👨‍💻|Cyber Tech|💻">Cyber Tech / IT</option>
            </select>
            <button class="btn" onclick="saveProfile()">ZAPISZ PROFIL</button>
            <button class="btn btn-secondary btn-danger" style="margin-top: 10px; font-size: 0.5rem;" onclick="resetAccount()">⚠️ ZRESETUJ POSTAĆ</button>
        </div>
    </div>

    <div id="screen-wardrobe" class="screen">
        <div class="card">
            <h3 style="color: var(--accent-pink);">CYFROWA SZAFA</h3>
            <div class="inventory-grid" id="inventoryContainer"></div>
        </div>
        <button class="btn btn-secondary" onclick="openScannerModal()">📷 SKANER PARAGONÓW</button>
    </div>

    <div id="screen-map" class="screen">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 12px;">
            <span style="font-size:0.55rem; color:var(--accent-green); font-family:'Press Start 2P', cursive;">GEO-RADAR</span>
            <span style="font-size:0.55rem; color:var(--accent-pink); font-family:'Press Start 2P', cursive;" id="gpsStatus">📡 Łączenie...</span>
        </div>
        <div id="map-view"></div>
        <div class="card" style="padding: 10px; margin-top: 10px;">
            <p style="font-size: 0.65rem; text-align:center; margin:0;" id="currentOutfitLabel">Aktywny set: Brak</p>
        </div>
    </div>

    <div id="screen-housing" class="screen">
        <div class="card">
            <h3 style="color: var(--accent-gold);">BAZA GŁÓWNA</h3>
            <div class="build-grid" id="housingGrid"></div>
        </div>
        <button class="btn btn-blue" onclick="craftMaterials()">⚒️ CRAFTING MATERIAŁÓW</button>
    </div>

    <div id="screen-quests" class="screen">
        <div class="card">
            <h3 style="color: var(--accent-gold);">GIEŁDA ZLECEŃ</h3>
            <div id="questList"></div>
        </div>
        <button class="btn" onclick="openQuestModal()">+ WYSTAW ZLECENIE</button>
    </div>

    <nav>
        <button id="nav-portal" class="active" onclick="switchScreen('screen-portal', this)"><i>🌐</i>PORTAL</button>
        <button id="nav-profile" onclick="switchScreen('screen-profile', this)"><i>🧑</i>POSTAĆ</button>
        <button id="nav-wardrobe" onclick="switchScreen('screen-wardrobe', this)"><i>👕</i>SZAFA</button>
        <button id="nav-map" onclick="switchScreen('screen-map', this)"><i>📍</i>MAPA</button>
        <button id="nav-housing" onclick="switchScreen('screen-housing', this)"><i>🏠</i>BAZA</button>
        <button id="nav-quests" onclick="switchScreen('screen-quests', this)"><i>📜</i>MISJE</button>
    </nav>

    <script>
        const STORAGE_KEY = 'geoverse_v1_data';
        const defaultState = {
            player: { name: "Nowy Gracz", icon: "🧑‍💻", className: "Cyber Tech", equipped: null, gold: 500, lvl: 1, exp: 0, energy: 100, typeValue: "👨‍💻|Cyber Tech|💻" },
            inventory: [{ name: "Koszulka Startowa", icon: "👕" }, { name: "Trampki Basic", icon: "👟" }],
            housing: [{ id: 1, name: "Wolne", icon: "➕" }, { id: 2, name: "Wolne", icon: "➕" }, { id: 3, name: "Wolne", icon: "➕" }],
            feed: [{ author: "SYSTEM", tag: "INFO", text: "Zainicjowano połączenie z serwerem GeoVerse." }],
            quests: [{ id: 1, title: "Szkolenie BHP", desc: "Zamelduj się w strefie.", rewardGold: 200, rewardExp: 150 }]
        };

        let appState = JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(JSON.stringify(defaultState));

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
            updateHUD();
        }

        function resetAccount() {
            if(confirm("Czy na pewno chcesz skasować postęp?")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        function showToast(message, type = 'info', icon = 'ℹ️') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span style="font-size: 1.2rem;">${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        let currentModalCallback = null;
        function openModal(title, placeholder, callback) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalInput').value = '';
            document.getElementById('modalInput').placeholder = placeholder;
            document.getElementById('modal-overlay').classList.add('show');
            document.getElementById('modalInput').focus();
            currentModalCallback = callback;
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
            currentModalCallback = null;
        }

        document.getElementById('modalConfirmBtn').addEventListener('click', () => {
            const val = document.getElementById('modalInput').value.trim();
            if (val && currentModalCallback) {
                currentModalCallback(val);
                closeModal();
            } else {
                showToast("Wprowadź wartość!", "error", "❌");
            }
        });

        function initApp() {
            updateHUD();
            renderProfile();
            renderFeed();
            renderInventory();
            renderHousing();
            renderQuests();
        }

        function updateHUD() {
            document.getElementById('statLvl').innerText = appState.player.lvl;
            document.getElementById('statGold').innerText = appState.player.gold;
            document.getElementById('statEnergy').innerText = appState.player.energy;
            document.getElementById('currentOutfitLabel').innerText = `Aktywny set: ${appState.player.equipped || "Brak"}`;
        }

        function renderFeed() {
            const container = document.getElementById('portalFeed');
            container.innerHTML = '';
            [...appState.feed].reverse().forEach(post => {
                container.innerHTML += `<div class="feed-item"><div class="feed-header"><span>${post.author}</span> <span>[${post.tag}]</span></div><p class="feed-body">${post.text}</p></div>`;
            });
        }

        function openPostModal() {
            openModal("NOWY WPIS", "O czym myślisz?", (text) => {
                appState.feed.push({ author: appState.player.name.toUpperCase(), tag: "SPOŁECZNOŚĆ", text });
                saveState();
                renderFeed();
                showToast("Wpis opublikowany!", "info", "✅");
            });
        }

        function updateAvatarPreview() {
            const val = document.getElementById('inputAvatarType').value.split('|');
            document.getElementById('avatarDisplay').innerText = val[0];
            document.getElementById('profileClassDisplay').innerText = val[1];
        }

        function renderProfile() {
            document.getElementById('inputName').value = appState.player.name;
            document.getElementById('inputAvatarType').value = appState.player.typeValue;
            document.getElementById('profileNameDisplay').innerText = appState.player.name;
            updateAvatarPreview();
        }

        function saveProfile() {
            const name = document.getElementById('inputName').value.trim();
            if(!name) return showToast("Nick nie może być pusty!", "error", "❌");
            const val = document.getElementById('inputAvatarType').value.split('|');
            appState.player.name = name;
            appState.player.icon = val[0];
            appState.player.className = val[1];
            appState.player.typeValue = document.getElementById('inputAvatarType').value;
            saveState();
            showToast("Zapisano profil!", "info", "🧬");
        }

        function renderInventory() {
            const container = document.getElementById('inventoryContainer');
            container.innerHTML = "";
            appState.inventory.forEach(item => {
                const isEquipped = (appState.player.equipped === item.name);
                container.innerHTML += `<div class="item-card ${isEquipped ? 'equipped' : ''}" onclick="equipItem('${item.name}')"><div style="font-size: 2.2rem; margin-bottom: 5px;">${item.icon}</div><h4>${item.name}</h4><p style="font-size:0.55rem; color:${isEquipped ? 'var(--accent-green)' : '#888'}; margin:0;">${isEquipped ? '★ ZAŁOŻONE' :
